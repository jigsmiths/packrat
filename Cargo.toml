[workspace]
resolver = "2"
members = ["crates/packrat-core", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jigsmiths/packrat"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
let_underscore_must_use = "deny"
disallowed_methods = "deny"
fn_params_excessive_bools = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
