[package]
name = "packrat-core"
description = "Clipboard history storage, search and pasteboard access for Packrat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = "0.4"
humantime = "2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSImageRep", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSString", "NSURL"] }
rusqlite = { version = "0.43", features = ["bundled-sqlcipher"] }
security-framework = "3"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
