[package]
name = "packrat-core"
description = "Clipboard history storage, search and pasteboard access for Packrat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4"
humantime = "2"
rusqlite = { version = "0.43", features = ["bundled-sqlcipher"] }
security-framework = "3"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
