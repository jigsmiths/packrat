name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # On its own, so the app's dependencies cannot enable features the core forgot to declare
      - run: cargo clippy -p packrat-core --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Clip text never goes through innerHTML
        run: "! grep -rn innerHTML app/ui"
      - name: Unsafe code stays in the listed files
        run: scripts/check-unsafe-sites.sh
      - run: cargo install cargo-about --version "^0.9" --features cli --locked
      - name: Check dependency licenses
        run: cargo about generate --locked --fail -m app/src-tauri/Cargo.toml -o "$RUNNER_TEMP/licenses.txt" about.hbs
