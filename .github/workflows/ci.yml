name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # With no arguments this installs what rust-toolchain.toml asks for
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # On its own, so the app's dependencies cannot enable features the core forgot to declare
      - run: cargo clippy -p packrat-core --all-targets -- -D warnings
      - run: cargo test --workspace
