name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  tag:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }} # the commit ci tested
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go install github.com/caarlos0/svu/v3@v3.4.4
      - name: Tag the next version, if the commits call for one
        id: tag
        run: |
          current=$(svu current)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! git rev-parse -q --verify "refs/tags/$current" > /dev/null; then
              echo "No tag to release yet"
              exit 1
            fi
            echo "tag=$current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          next=$(svu next --v0)
          if [ "$next" = "$current" ]; then
            echo "No release needed (current: $current)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: macos-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo install cargo-about --version "^0.9" --features cli --locked
      # A stable identity keeps the Accessibility and Keychain grants across
      # upgrades. Tauri's own APPLE_CERTIFICATE import only accepts
      # Apple-issued certificates, so a self-signed one is imported here.
      - name: Import the signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "No signing certificate, the build will be ad hoc signed"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" \
            -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "identity=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
      - name: Build and package
        id: package
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          if [ -n "$SIGNING_IDENTITY" ]; then
            export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"
          fi
          version="${TAG#v}"
          just package "$version"
          codesign -dvv target/release/bundle/macos/Packrat.app 2>&1 | grep -E "^(Authority|Signature)"
          zip="dist/Packrat-$version.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "$TAG" --generate-notes
          fi
      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: jigsmiths/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap
      - name: Update cask
        env:
          VERSION: ${{ steps.package.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        working-directory: tap
        run: |
          cat > Casks/packrat.rb <<EOF
          # This file is generated by the jigsmiths/packrat release workflow. DO NOT EDIT.
          cask "packrat" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/jigsmiths/packrat/releases/download/v#{version}/Packrat-#{version}.zip"
            name "Packrat"
            desc "Clipboard history in the menu bar"
            homepage "https://github.com/jigsmiths/packrat"

            livecheck do
              skip "Auto-generated on release."
            end

            depends_on arch: :arm64
            depends_on macos: :monterey

            app "Packrat.app"

            # Not notarized, so skip the Gatekeeper prompt.
            postflight_steps do
              run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{appdir}}/Packrat.app"]
            end

            zap trash: [
              "~/Library/Application Support/com.jigsmiths.packrat",
              "~/Library/Logs/com.jigsmiths.packrat",
            ]
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/packrat.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
            exit 0
          fi
          git commit -m "packrat $VERSION"
          git push
