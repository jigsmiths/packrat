<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Packrat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input id="filter" type="text" placeholder="Filter clips" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Filter clips">
<main>
  <ul id="list" role="listbox" aria-label="Clips"></ul>
  <section id="detail" aria-label="Preview">
    <pre id="preview"></pre>
    <img id="image" alt="" hidden>
    <p id="meta"></p>
  </section>
</main>
<footer>
  <span id="hint"></span>
  <button id="permission" type="button" hidden>Allow pasting…</button>
  <span id="count"></span>
</footer>
<script src="main.js"></script>
</body>
</html>
